name: magic-stream-movie

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend

  server:
    build:
      context: ./Server/MagicStreamMoviesServer
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: "8080"
      MONGODB_URI: mongodb://mongodb:27017
      DATABASE_NAME: ${DATABASE_NAME:-magic_stream_movies}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set in .env}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_TIMEOUT: ${AI_TIMEOUT:-30s}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

volumes:
  mongodb_data:

networks:
  backend:
    driver: bridge
